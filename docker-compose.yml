version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: agriguard_postgis
    environment:
      POSTGRES_USER: agriguard
      POSTGRES_PASSWORD: agriguard_secret
      POSTGRES_DB: agriguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriguard -d agriguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
