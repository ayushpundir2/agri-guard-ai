services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: agriguard-ai-python-api
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agriguard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://agriguard-ai-frontend.onrender.com,http://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: PROTOTYPE_CITY
        value: "Pune, Maharashtra, India"

  # 2. Frontend Web Service (Next.js)
  - type: web
    name: agriguard-ai-frontend
    env: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: agriguard-ai-python-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MAP_STYLE
        value: "https://api.maptiler.com/maps/streets-v4/style.json?key=dWHouXiGVzthZLKblES4"

databases:
  # 3. PostgreSQL Database with PostGIS
  - name: agriguard-db
    databaseName: agriguard_db
    user: agriguard
    region: singapore
    plan: free
